<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : plein écran sur mobile, gestion des encoches -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e14" />
    <title>Jarvis</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Import map : résout 'three' et 'three/addons/' vers les fichiers
         vendorisés locaux utilisés par talkinghead.mjs au runtime.
         Doit apparaître avant tout <script type="module">. -->
    <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/three.module.js",
        "three/addons/": "/vendor/three/addons/"
      }
    }
    </script>
  </head>
  <body>
    <!-- Conteneur de rendu de l'avatar (TalkingHead gère son propre WebGL). -->
    <div id="avatar"></div>

    <!-- Canvas WebGL de repli : scène placeholder si l'avatar n'est pas dispo. -->
    <canvas id="scene"></canvas>

    <!-- Zone UI superposée, vide pour l'instant (le HUD arrive en F5.2). -->
    <div id="hud" aria-live="polite"></div>

    <!-- Écran de chargement : spinner + barre de progression + message. -->
    <div id="boot">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-label" id="boot-label">Initialisation de Jarvis…</p>
      <div class="boot-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="boot-bar-fill" id="boot-bar-fill"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
