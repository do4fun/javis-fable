<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover : plein écran sur mobile, gestion des encoches -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e14" />
    <title>Jarvis</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Canvas WebGL plein écran : la scène 3D y est rendue (scene.js). -->
    <canvas id="scene"></canvas>

    <!-- Zone UI superposée, vide pour l'instant (le HUD arrive en F5.2). -->
    <div id="hud" aria-live="polite"></div>

    <!-- Écran de chargement simple (l'avatar et sa barre arrivent en F1.1). -->
    <div id="boot">
      <div class="boot-spinner" aria-hidden="true"></div>
      <p class="boot-label">Initialisation de Jarvis…</p>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
