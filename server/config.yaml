# Configuration serveur Jarvis.
# Les sections marquées (Fx.y) seront exploitées par la fonctionnalité
# correspondante. À ce stade (F0.2), seules server/* et cors/* sont utilisées.

server:
  host: "127.0.0.1"
  port: 8000

# Contrainte globale : aucune sortie réseau à l'exécution.
allow_network: false

cors:
  origins:
    - "http://localhost:8000"
    - "http://localhost:5173"

# --- à modifier par Claude : engin par défaut ---
# tts:
#  engine: dummy   # onde sinusoïdale, aucune dépendance

# --- Réservé pour les fonctionnalités suivantes ---
tts: # F2.1
  engine: "kokoro"
  voice: "ff_siwis"
  sample_rate: 24000

# Si Kokoro n'est pas installé ou plante, le serveur peut utiliser piper-tts comme deuxième repli avant de basculer sur le moteur dummy
#tts:
#  engine: piper
#  piper_model: models/fr_FR-siwis-medium.onnx
#  sample_rate: 22050


stt: # F3.2
  model: "base"        # tiny | base | small | medium | large-v3
  # "base" (74M) est ~3× plus rapide que "small" (244M) pour une qualité
  # correcte en français. Repasse à "small" si la transcription est trop imprécise.
  language: "fr"


llm:  # F4.1
  # Fournisseur LLM actif : "claude" (Anthropic API) | "ollama" (local)
  provider: "claude"

  # ── Claude (Anthropic API) ────────────────────────────────────────────────
  # Modèle le plus avancé disponible. Obtenir une clé sur console.anthropic.com
  # La clé est lue depuis la variable d'env ANTHROPIC_API_KEY (priorité), ou
  # directement ici. Ne jamais committer une clé réelle dans le dépôt.
  model: "claude-sonnet-4-6"
  api_key: ""                          # laisser vide si ANTHROPIC_API_KEY est défini
 
  # ── Ollama (100 % local, aucune clé) ──────────────────────────────────────
  # Pour basculer sur Ollama : passe provider à "ollama" et adapte host/model.
  host: "http://localhost:11434"  # URL d'Ollama
  # model: "llama3.1:8b"         # modèle Ollama à utiliser

  # ── Commun ────────────────────────────────────────────────────────────────
  timeout: 60                     # secondes avant abandon de la génération
  tutoiement: true                # Jarvis tutoie l'utilisateur
