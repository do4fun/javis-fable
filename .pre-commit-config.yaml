# Hooks pre-commit de Jarvis (F5.3). Installer : `pip install pre-commit && pre-commit install`.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
        files: ^server/

  - repo: local
    hooks:
      - id: eslint
        name: eslint (web)
        entry: bash -c 'cd web && npm run lint'
        language: system
        files: ^web/.*\.js$
        pass_filenames: false
